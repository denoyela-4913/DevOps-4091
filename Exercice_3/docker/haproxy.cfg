# Config principale = configs/v006 (meilleure config mesurée, voir results/ANALYSE-STRESS.md).
# v006 : requêtes longues ou serveurs de puissance inégale, fortes charges.
# leastconn répartit selon les connexions en cours, slowstart ramène un serveur progressivement,
# maxconn par serveur évite de le saturer (les requêtes en trop attendent dans la file de HAProxy).
#
# Schéma : client --:80--> frontend http_in --> backend webservers --> webserver1:80 / webserver2:80
# Les durées s'écrivent avec une unité : 500ms (millisecondes), 1s (seconde).

# ---------------------------------------------------------------------------------------------
# global : réglages du processus HAProxy lui-même
# ---------------------------------------------------------------------------------------------
global
  # Nombre maximal de connexions simultanées pour tout HAProxy (clients, tous serveurs confondus).
  # Au-delà, les nouvelles connexions attendent dans le backlog du système, puis sont refusées.
  # Volontaire : protège les serveurs d'un déni de service. C'est une limite de connexions
  # simultanées, pas de requêtes/s (débit max ≈ connexions / durée d'une requête).
  maxconn 100

# ---------------------------------------------------------------------------------------------
# defaults : valeurs appliquées à tous les frontends/backends qui suivent
# ---------------------------------------------------------------------------------------------
defaults
  # Protocole analysé : http = HAProxy comprend les requêtes HTTP (logs, 5xx, vérification HTTP).
  # L'autre choix courant est « tcp » (transfert d'octets sans lecture du contenu).
  mode http

  # Temps maximal d'inactivité côté client (entre deux paquets) avant de fermer la connexion.
  timeout client 10s
  # Temps maximal pour établir la connexion TCP vers un serveur. Un serveur arrêté ne répond pas :
  # la requête attend ce délai avant d'être retentée ailleurs. Court = bascule plus rapide.
  timeout connect 1s
  # Temps maximal d'inactivité côté serveur (attente de la réponse) avant d'abandonner (erreur 504).
  timeout server 10s
  # Temps maximal pour que le client envoie sa requête HTTP complète (protège des clients très lents).
  timeout http-request 10s
  # Temps maximal pour la réponse d'un test de santé (s'ajoute à la connexion, limitée par timeout connect).
  timeout check 1s
  # Durée maximale d'attente d'une requête dans la file de HAProxy quand tous les serveurs ont atteint
  # leur maxconn. Passé ce délai : erreur 503 au client.
  timeout queue 5s

  # Nombre de nouvelles tentatives si la connexion vers un serveur échoue (2 retentatives = 3 essais au total).
  retries 2
  # Autorise une nouvelle tentative sur un AUTRE serveur (sinon HAProxy réessaie le même, déjà en panne).
  option redispatch

# ---------------------------------------------------------------------------------------------
# resolvers : résolution DNS des noms de serveurs (ici le DNS interne de Docker)
# ---------------------------------------------------------------------------------------------
resolvers docker
  # Serveur DNS interrogé : 127.0.0.11:53 est le DNS intégré de Docker (résout « webserver1 », etc.).
  nameserver dns1 127.0.0.11:53
  # Durée pendant laquelle une réponse DNS valide est gardée avant d'être redemandée
  # (permet de suivre un conteneur dont l'adresse IP change).
  hold valid 10s

# ---------------------------------------------------------------------------------------------
# frontend : point d'entrée, ce que voient les clients
# ---------------------------------------------------------------------------------------------
frontend http_in
  # Écoute sur le port 80 de toutes les interfaces (« * » = toutes les adresses).
  bind *:80
  # Où envoyer les requêtes reçues : vers le backend « webservers ».
  default_backend webservers

# ---------------------------------------------------------------------------------------------
# backend : groupe de serveurs et règles de répartition
# ---------------------------------------------------------------------------------------------
backend webservers
  # Algorithme de répartition : leastconn = chaque requête va au serveur qui a le moins de connexions
  # en cours. Un serveur lent ou en panne cumule des connexions et reçoit donc moins de trafic
  # (autres choix : roundrobin = chacun son tour, source = selon l'IP du client).
  balance leastconn

  # Test de santé actif : toutes les secondes HAProxy envoie « GET / » à chaque serveur.
  option httpchk GET /
  # Le serveur est jugé sain seulement s'il répond HTTP 200 (par défaut : tout code 2xx ou 3xx).
  http-check expect status 200

  # Réglages communs à tous les « server » ci-dessous :
  #   check          active le test de santé pour ce serveur
  #   inter 1s       intervalle entre deux tests quand le serveur est stable (UP)
  #   fastinter 500ms  intervalle entre deux tests quand son état est en train de changer
  #   downinter 2s   intervalle entre deux tests quand le serveur est HS (DOWN)
  #   fall 2         nombre d'échecs consécutifs pour déclarer le serveur HS
  #   rise 2         nombre de succès consécutifs pour le déclarer de nouveau UP
  #   slowstart 10s  à son retour, le serveur reprend sa part de trafic progressivement sur 10 s
  #   maxconn 50     connexions simultanées maximum envoyées à ce serveur ; les suivantes attendent
  #                  dans la file (timeout queue). Évite aussi qu'un serveur mort accapare les 100 du global.
  #   resolvers docker  utilise la section DNS ci-dessus pour résoudre le nom du serveur
  #   init-addr libc,none  résolution au démarrage par le système (libc) ; si elle échoue, HAProxy
  #                  démarre quand même (« none ») et réessaiera via le DNS, au lieu de refuser de démarrer
  default-server check inter 1s fastinter 500ms downinter 2s fall 2 rise 2 slowstart 10s maxconn 50 resolvers docker init-addr libc,none

  # Les deux serveurs : « server <nom> <adresse>:<port> » (le nom est résolu par le DNS de Docker).
  server webserver1 webserver1:80
  server webserver2 webserver2:80
