# v005 : beaucoup de serveurs, peu de tests actifs. Le vrai trafic sert de détecteur de panne.
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 1s
  timeout server 10s
  timeout http-request 10s
  timeout check 1s
  retries 2
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  default-server check inter 5s fall 3 rise 2 observe layer4 error-limit 2 on-error mark-down resolvers docker init-addr libc,none
  server webserver1 webserver1:80
  server webserver2 webserver2:80
