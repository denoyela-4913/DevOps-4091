# v003 : réseau instable (anti-flapping), version 2.
# Les décisions de santé sont prudentes (fall 4, rise 4) pour ne pas écarter un serveur à cause
# d'un incident passager. L'utilisateur est protégé pendant ce temps par retries + redispatch,
# avec un timeout connect court (1s) : une connexion qui échoue est renvoyée vers l'autre serveur.
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 1s
  timeout server 10s
  timeout http-request 10s
  timeout check 2s
  retries 3
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  default-server check inter 3s fastinter 1s downinter 5s fall 4 rise 4 resolvers docker init-addr libc,none
  server webserver1 webserver1:80
  server webserver2 webserver2:80
