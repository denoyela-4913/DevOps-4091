# v010 (= v004 + init-state down, HAProxy 3.1+) : un serveur n’est utilisé qu’après avoir réussi ses tests de santé (utile après redémarrage).
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 500ms
  timeout server 10s
  timeout http-request 10s
  timeout check 500ms
  retries 1
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  default-server check inter 500ms fastinter 250ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions init-state down resolvers docker init-addr libc,none
  server webserver1 webserver1:80
  server webserver2 webserver2:80
