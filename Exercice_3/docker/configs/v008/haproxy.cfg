# v008 : vérification légère. Requête HEAD (sans corps de réponse), peu fréquente en régime normal,
# rapide quand l'état change (fastinter), espacée sur un serveur déjà HS (downinter).
# Objectif : limiter la charge des tests quand il y a beaucoup de serveurs.
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 1s
  timeout server 10s
  timeout http-request 10s
  timeout check 1s
  retries 2
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  option httpchk
  http-check send meth HEAD uri / ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server check inter 3s fastinter 500ms downinter 5s fall 2 rise 2 resolvers docker init-addr libc,none
  server webserver1 webserver1:80
  server webserver2 webserver2:80
