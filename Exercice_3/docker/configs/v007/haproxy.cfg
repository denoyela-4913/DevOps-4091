# v007 : application avec sessions (panier, connexion). Un visiteur reste sur le même serveur
# grâce à un cookie. Si ce serveur tombe, redispatch l'envoie vers l'autre.
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 1s
  timeout server 10s
  timeout http-request 10s
  timeout check 1s
  retries 2
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

backend webservers
  balance roundrobin
  cookie SRV insert indirect nocache
  option httpchk GET /
  http-check expect status 200
  default-server check inter 1s fastinter 500ms downinter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server webserver1 webserver1:80 cookie s1
  server webserver2 webserver2:80 cookie s2
