# v012 (= v004 avec une section healthcheck, HAProxy 3.4+) : le test de santé est défini une fois et réutilisable par plusieurs serveurs.
global
  maxconn 100

defaults
  mode http
  timeout client 10s
  timeout connect 500ms
  timeout server 10s
  timeout http-request 10s
  timeout check 500ms
  retries 1
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  hold valid 10s

frontend http_in
  bind *:80
  default_backend webservers

healthcheck hc_web
  type httpchk
  http-check connect
  http-check send meth GET uri /
  http-check expect status 200

backend webservers
  balance roundrobin
  default-server check healthcheck hc_web inter 500ms fastinter 250ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
  server webserver1 webserver1:80
  server webserver2 webserver2:80
