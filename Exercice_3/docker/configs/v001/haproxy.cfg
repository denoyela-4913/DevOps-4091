# ---------------------------------------------------------------------------------------------
# global : réglages du processus HAProxy lui-même
# ---------------------------------------------------------------------------------------------
global
  # Nombre maximal de connexions simultanées pour tout HAProxy (clients, tous serveurs confondus).
  # Au-delà, les nouvelles connexions attendent dans le backlog du système, puis sont refusées.
  # Volontaire : protège les serveurs d'un déni de service. Limite de connexions simultanées, pas de requêtes/s
  # (débit max ≈ connexions / durée d'une requête).
  maxconn 100

# ---------------------------------------------------------------------------------------------
# defaults : valeurs appliquées à tous les frontends/backends qui suivent
# ---------------------------------------------------------------------------------------------
defaults
  # Protocole analysé : http = HAProxy comprend les requêtes HTTP (logs, 5xx, tests HTTP). Autre choix : tcp.
  mode http
  # timeout client 10s : Temps maximal d'inactivité côté client (entre deux paquets) avant de fermer la connexion.
  timeout client 10s
  # timeout connect 5s : Temps maximal pour établir la connexion TCP vers un serveur. Un serveur arrêté ne répond pas : la requête
  # attend ce délai avant d'être retentée ailleurs. Court = bascule plus rapide.
  timeout connect 5s
  # timeout server 10s : Temps maximal d'inactivité côté serveur (attente de la réponse) avant d'abandonner (erreur 504).
  timeout server 10s
  # timeout http-request 10s : Temps maximal pour que le client envoie sa requête HTTP complète (protège des clients très lents).
  timeout http-request 10s

# DNS interne de Docker, pour résoudre webserver1 et webserver2
# ---------------------------------------------------------------------------------------------
# resolvers : résolution DNS des noms de serveurs (ici le DNS interne de Docker)
# ---------------------------------------------------------------------------------------------
resolvers docker
  # Serveur DNS interrogé : 127.0.0.11:53 est le DNS intégré de Docker (résout « webserver1 », etc.).
  nameserver dns1 127.0.0.11:53
  # Durée pendant laquelle une réponse DNS valide est gardée avant d'être redemandée
  # (permet de suivre un conteneur dont l'adresse IP change).
  hold valid 10s

# ---------------------------------------------------------------------------------------------
# frontend : point d'entrée, ce que voient les clients
# ---------------------------------------------------------------------------------------------
frontend http_in
  # Écoute sur le port 80 de toutes les interfaces (« * » = toutes les adresses).
  bind *:80
  # Où envoyer les requêtes reçues : vers le backend « webservers ».
  default_backend webservers

# ---------------------------------------------------------------------------------------------
# backend : groupe de serveurs et règles de répartition
# ---------------------------------------------------------------------------------------------
backend webservers
  # Algorithme de répartition : roundrobin = chaque serveur à tour de rôle, sans tenir compte de sa charge.
  # Un serveur en panne non encore détecté reçoit donc sa part de requêtes.
  balance roundrobin
  # Test de santé actif : HAProxy envoie « GET / » à chaque serveur (intervalle : voir inter/fastinter/downinter).
  option httpchk GET /
  # Serveur « webserver1 » : adresse webserver1:80 (le nom est résolu par le DNS de Docker).
  # Options propres à ce serveur :
  #   check                  active le test de santé pour ce serveur
  #   resolvers docker       utilise la section DNS « resolvers » du même nom pour résoudre le nom du serveur
  #   init-addr libc,none    adresse initiale : libc = résolution par le système au démarrage ; none = démarrer quand même si elle échoue
  #                            (HAProxy réessaiera via le DNS) au lieu de refuser de démarrer
  server webserver1 webserver1:80 check resolvers docker init-addr libc,none
  # Serveur « webserver2 » : adresse webserver2:80 (le nom est résolu par le DNS de Docker).
  # Options propres à ce serveur :
  #   check                  active le test de santé pour ce serveur
  #   resolvers docker       utilise la section DNS « resolvers » du même nom pour résoudre le nom du serveur
  #   init-addr libc,none    adresse initiale : libc = résolution par le système au démarrage ; none = démarrer quand même si elle échoue
  #                            (HAProxy réessaiera via le DNS) au lieu de refuser de démarrer
  server webserver2 webserver2:80 check resolvers docker init-addr libc,none
